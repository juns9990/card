<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>김기준 · Vela — 디지털 명함</title>
<meta name="theme-color" content="#0B0D10">
<meta property="og:title" content="김기준 · Vela">
<meta property="og:description" content="VELA SYSTEM · MES · 3D Print — Founder · Developer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vela">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
/* ── PWA ── */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
(function(){
  var pill = document.getElementById('installPill');
  var deferred = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    if(!standalone) pill.classList.add('show');
  });
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS && !standalone){
    pill.innerHTML = '<i>⊕</i>공유 → "홈 화면에 추가"로 설치';
    setTimeout(function(){ pill.classList.add('show'); }, 6500);
  }
  pill.addEventListener('click', function(){
    if(deferred){
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; pill.classList.remove('show'); });
    } else {
      pill.classList.remove('show');
    }
  });
})();
</script>
<style>
  :root{
    --bg:#0B0D10; --paper:#F4F5F7; --paper2:#FFFFFF;
    --card:#121417; --card2:#1B1E23;
    --mint:#5CE8C9; --mint-deep:#0FA98A;
    --ink:#14171D; --ink-soft:#5A616C; --line-lt:#E1E4E8;
    --txt:#F5F6F8; --sub:#8B93A0; --line:rgba(255,255,255,.12);
    --mono:'IBM Plex Mono',Consolas,'Courier New',monospace;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --logo:'Georgia','Times New Roman',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);font-family:var(--sans);color:var(--txt);min-height:100vh;min-height:100dvh;overflow-x:hidden}
  .logo{font-family:var(--logo);font-style:italic;font-weight:800;line-height:1}
  .logo .m{color:var(--mint)}

  /* ═══ 인트로 ═══ */
  #intro{position:fixed;inset:0;z-index:50;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .6s, visibility .6s}
  #intro.hide{opacity:0;visibility:hidden}
  .in-stage{text-align:center;padding:0 30px}
  .skip{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#4A5262}
  .i1-logo{font-size:62px;opacity:0;animation:fadeUp .8s .2s forwards}
  .i1-copy{margin-top:22px;font-size:16.5px;color:var(--sub);letter-spacing:.04em;line-height:1.8;
    opacity:0;animation:fadeUp .8s 1s forwards}
  .i1-copy b{color:var(--txt);font-weight:600}
  .i1-sub{margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mint);
    opacity:0;animation:fadeUp .8s 1.7s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .i1-copy.swap{animation:none;opacity:1}
  .i1-copy.out{transition:opacity .5s,transform .5s;opacity:0;transform:translateY(-12px)}
  .i1-copy.in2{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
  .i1-copy.in2.go{opacity:1;transform:none}

  /* ═══ 3D 카드 ═══ */
  .main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:30px 16px}
  .stage{perspective:1200px;touch-action:pan-y}
  .flip{position:relative;width:330px;height:196px;max-width:88vw;
    transform-style:preserve-3d;cursor:grab;will-change:transform;transition:transform .12s linear}
  .flip.snap{transition:transform .6s cubic-bezier(.2,.8,.25,1)}
  .flip:active{cursor:grabbing}
  .face{position:absolute;inset:0;border-radius:14px;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 22px 55px rgba(0,0,0,.5)}
  .face.bk{transform:rotateY(180deg)}
  .gloss{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.14) 50%,transparent 58%)}

  /* 앞면: 블랙 브랜드 */
  .ff{background:radial-gradient(130% 150% at 50% 0%,var(--card2) 0%,var(--card) 60%,#0C0E11 100%);color:var(--txt);display:flex}
  .ff .bar{width:7px;background:linear-gradient(180deg,var(--mint),var(--mint-deep))}
  .ff .bd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .ff .logo{font-size:44px;color:#F5F6F8}
  .ff .sys{margin-top:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.42em;text-indent:.42em;color:var(--mint);font-weight:600}
  .ff .tg{margin-top:5px;font-family:var(--mono);font-size:7px;letter-spacing:.26em;text-indent:.26em;color:var(--sub)}
  .ff .corner{position:absolute;bottom:12px;right:16px;font-family:var(--mono);font-size:7.5px;color:#4A5262;letter-spacing:.1em}

  /* 뒷면: 라이트 연락처 */
  .fb{background:linear-gradient(150deg,var(--paper2) 0%,var(--paper) 70%);color:var(--ink);display:flex}
  .fb .bar{width:7px;background:linear-gradient(180deg,var(--mint),var(--mint-deep))}
  .fb .bd{flex:1;padding:16px 18px 13px;display:flex;flex-direction:column}
  .fb .row1{display:flex;justify-content:space-between;align-items:flex-start}
  .fb .sys{font-family:var(--mono);font-size:7px;letter-spacing:.3em;color:var(--mint-deep);margin-bottom:5px;font-weight:700}
  .fb .nm{font-size:19px;font-weight:800;letter-spacing:.04em;color:var(--ink)}
  .fb .rl{font-size:8.5px;color:var(--ink-soft);margin-top:4px}
  .fb .rl b{color:var(--ink)}
  .qrbox{width:52px;height:52px;padding:3px;background:#fff;border:1.2px solid var(--ink);border-radius:5px}
  .qrbox img,.qrbox canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
  .fb .lines{margin-top:auto;border-top:1.5px solid var(--line-lt);display:flex;flex-direction:column}
  .fb .ln{display:flex;align-items:baseline;gap:10px;padding:7.5px 2px;border-bottom:1px solid #EEF0F3;text-decoration:none;color:inherit}
  .fb .ln:last-child{border-bottom:0}
  .fb .ln:active{background:rgba(92,232,201,.15)}
  .fb .k{font-family:var(--mono);font-size:6.8px;letter-spacing:.16em;color:var(--mint-deep);width:40px;font-weight:700}
  .fb .v{font-size:11.5px;font-weight:600;color:var(--ink)}

  .hint{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#5A6577;text-align:center}
  .hint b{color:var(--mint);font-weight:500}

  /* 카피 시안 */
  .copies{margin-top:34px;max-width:340px;display:flex;flex-direction:column;gap:7px}
  .cp-cap{text-align:center;font-size:10px;color:#4A5262;font-family:var(--mono);letter-spacing:.12em;margin-bottom:4px}
  .cp{font-size:13.5px;letter-spacing:.02em;line-height:1.5;
    padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);color:#C9CDD4;cursor:pointer;text-align:left;
    font-family:inherit;display:flex;gap:10px;align-items:baseline}
  .cp i{font-style:normal;font-family:var(--mono);font-size:9px;color:#5A6577;width:16px;flex-shrink:0}
  .cp b{color:var(--txt);font-weight:600}
  .cp:active,.cp.on{border-color:rgba(92,232,201,.55);background:rgba(92,232,201,.07)}
  .cp.on i{color:var(--mint)}
  #installPill{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(60px);
    display:flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:99px;z-index:40;
    background:#171C24;border:1px solid rgba(92,232,201,.4);color:var(--txt);
    font-size:13px;font-weight:600;cursor:pointer;opacity:0;
    transition:opacity .4s,transform .4s;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #installPill.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #installPill i{font-style:normal;color:var(--mint)}
</style>
</head>
<body>

<div id="intro"><div class="in-stage" id="inStage"></div><div class="skip">탭하여 건너뛰기</div></div>

<div class="main">
  <div class="stage">
    <div class="flip" id="flip">
      <!-- 앞면: 블랙 -->
      <div class="face ff">
        <div class="bar"></div>
        <div class="bd">
          <div class="logo">Ve<span class="m">l</span>a</div>
          <div class="sys">VELA SYSTEM</div>
          <div class="tg">SOFTWARE · 3D MANUFACTURING</div>
          <div class="corner">LOT 2026-VELA-001</div>
        </div>
        <div class="gloss"></div>
      </div>
      <!-- 뒷면: 라이트 -->
      <div class="face bk fb">
        <div class="bar"></div>
        <div class="bd">
          <div class="row1">
            <div>
              <div class="sys">VELA SYSTEM</div>
              <div class="nm">김기준</div>
              <div class="rl"><b>VELA</b> 개발·운영 총괄 / Founder · Developer</div>
            </div>
            <div class="qrbox" id="qr"></div>
          </div>
          <div class="lines">
            <a class="ln" href="tel:010-7195-0069"><span class="k">CALL</span><span class="v">010-7195-0069</span></a>
            <a class="ln" href="sms:010-7195-0069"><span class="k">SMS</span><span class="v">문자 보내기</span></a>
            <a class="ln" href="mailto:juns@kakao.com"><span class="k">MAIL</span><span class="v">juns@kakao.com</span></a>
            <a class="ln" href="https://github.com/juns9990" target="_blank" rel="noopener"><span class="k">GIT</span><span class="v">github.com/juns9990</span></a>
          </div>
        </div>
        <div class="gloss"></div>
      </div>
    </div>
  </div>
  <div class="hint"><b>드래그</b> 회전 · <b>탭</b> 뒤집기 · 뒷면 연락처 <b>터치 연결</b></div>

</div>

<script>
new QRCode(document.getElementById('qr'), {
  text:'https://juns9990.github.io/card/', width:160, height:160,
  colorDark:'#14171D', colorLight:'#FFFFFF', correctLevel:QRCode.CorrectLevel.M
});

var intro = document.getElementById('intro');
var stage = document.getElementById('inStage');
var timer = null;

var timers = [];
function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function playIntro(copyHtml){
  clearAll();
  stage.innerHTML =
    '<div class="logo i1-logo">Ve<span class="m">l</span>a</div>' +
    '<div class="i1-copy">' + copyHtml + '</div>' +
    '<div class="i1-sub">VELA SYSTEM · MES</div>';
  intro.classList.remove('hide');
  timers.push(setTimeout(function(){ intro.classList.add('hide'); }, 3200));
}

/* 시퀀스: 카피1 등장 → 교체 → 카피2 → 카드 */
function playIntroSeq(c1, c2){
  clearAll();
  stage.innerHTML =
    '<div class="logo i1-logo">Ve<span class="m">l</span>a</div>' +
    '<div class="i1-copy" id="cpEl">' + c1 + '</div>' +
    '<div class="i1-sub">VELA SYSTEM · MES</div>';
  intro.classList.remove('hide');
  timers.push(setTimeout(function(){
    var el = document.getElementById('cpEl');
    if(!el) return;
    el.classList.add('swap','out');
    timers.push(setTimeout(function(){
      el.innerHTML = c2;
      el.classList.remove('out'); el.classList.add('in2');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('go'); }); });
    }, 520));
  }, 2500));
  timers.push(setTimeout(function(){ intro.classList.add('hide'); }, 5600));
}
intro.addEventListener('click', function(){ clearAll(); intro.classList.add('hide'); });

var SEQ1 = '공장의 오늘을, <b>켜다</b>.';
var SEQ2 = '오늘 만든 모든 것이, <b>내일의 기준</b>이 됩니다.';
playIntroSeq(SEQ1, SEQ2);

(function(){
  var el = document.getElementById('flip');
  var rot=0, dragging=false, moved=false, sx=0, sr=0;
  function apply(){ el.style.transform='rotateY('+rot+'deg)'; }
  el.addEventListener('pointerdown', function(e){
    if(e.target.closest('a')) return;
    dragging=true; moved=false; sx=e.clientX; sr=rot;
    el.classList.remove('snap'); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx=e.clientX-sx;
    if(Math.abs(dx)>6) moved=true;
    rot=sr+dx*0.6; apply();
  });
  function rel(){
    if(!dragging) return;
    dragging=false; el.classList.add('snap');
    rot = moved ? Math.round(rot/180)*180 : Math.round(rot/180)*180+180;
    apply();
  }
  el.addEventListener('pointerup', rel);
  el.addEventListener('pointercancel', rel);
})();
</script>
<button id="installPill"><i>⊕</i>홈 화면에 앱으로 설치</button>
</body>
</html>
